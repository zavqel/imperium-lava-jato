<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Administração | IMPÉRIUM</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--panel:#14191f;--panel-2:#11151a;--line:#2b323a;--text:#fff;--muted:#a7b0bc;--brand:#0fb8ad;--danger:#8b2d2d}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:16px}.login-box{width:min(420px,100%);padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.login-box h1{margin:0}.muted{color:var(--muted)}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:.82rem;color:#c5ccd5}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #3b424c;border-radius:9px;background:#0f1114;color:#fff}.field textarea{min-height:86px;resize:vertical}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:800}.primary{background:var(--brand);color:#061311}.secondary{background:#29313b;color:#fff}.danger{background:var(--danger);color:#fff}.layout{display:flex;min-height:100vh}.sidebar{width:235px;position:fixed;inset:0 auto 0 0;padding:20px;background:var(--panel-2);border-right:1px solid var(--line)}.sidebar h2{margin:0}.nav{margin-top:18px}.nav button{display:block;width:100%;margin:4px 0;padding:11px;border:0;border-radius:8px;background:transparent;color:#cfd5dc;text-align:left;cursor:pointer}.nav button:hover,.nav button.active{background:#1e2832;color:#fff}.main{width:calc(100% - 235px);margin-left:235px;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0}.panel{padding:20px;margin-bottom:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.card strong{display:block;margin-top:5px;font-size:1.6rem}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table td small{display:block;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#29313b;font-size:.75rem}.modal{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:18px;background:#000b}.modal-box{width:min(780px,100%);max-height:92vh;overflow:auto;padding:22px;border:1px solid #3b424c;border-radius:16px;background:#151a20}.modal-box h2{margin-top:0}.section-copy{margin-top:0}.config-key{font:700 .8rem/1.2 monospace;color:#88d9d5}.image-thumb{width:46px;height:34px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:8px}@media(max-width:880px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.layout{display:block}.sidebar{position:static;width:100%}.main{width:100%;margin:0;padding:17px}.grid,.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.sidebar .nav{display:flex;gap:4px;overflow:auto}.sidebar .nav button{min-width:max-content}.sidebar .nav #logout{margin-left:auto}}
  </style>
</head>
<body>
  <section id="login" class="login"><div class="login-box"><h1>IMPÉRIUM</h1><p class="muted">Painel administrativo</p><form id="login-form"><div class="field"><label for="login-email">E-mail</label><input id="login-email" type="email" value="admin@imperium.local" autocomplete="username"></div><div class="field"><label for="login-password">Senha</label><input id="login-password" type="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%">Entrar</button><p id="login-error" role="alert"></p></form></div></section>
  <div id="app" class="layout hidden"><aside class="sidebar"><h2>IMPÉRIUM</h2><p class="muted">Administração</p><nav class="nav"><button data-section="dashboard">Dashboard</button><button data-section="site">Página inicial</button><button data-section="servicos">Serviços</button><button data-section="promocoes">Promoções</button><button data-section="agendamentos">Agendamentos</button><button data-section="clientes">Clientes</button><button id="logout">Sair</button></nav></aside><main class="main"><div class="top"><div><h1 id="section-title">Dashboard</h1><p class="muted section-copy">Controle central do site e da operação.</p></div><button class="btn secondary" id="refresh">Atualizar</button></div><section id="sec-dashboard"></section><section id="sec-site" class="hidden"></section><section id="sec-servicos" class="hidden"></section><section id="sec-promocoes" class="hidden"></section><section id="sec-agendamentos" class="hidden"></section><section id="sec-clientes" class="hidden"></section></main></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <script>
    "use strict";
    const API="https://imperium-api.imperiumlj.workers.dev";
    let TOKEN=localStorage.getItem("imperium_admin_token")||"";
    let SERVICES=[]; let PROMOTIONS=[]; let CONFIG={};
    const $=(selector,scope=document)=>scope.querySelector(selector);
    const esc=(value)=>String(value??"").replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"})[char]);
    const money=value=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(value)||0);
    async function api(path,opt={}){const response=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json",Authorization:TOKEN?"Bearer "+TOKEN:"",...(opt.headers||{})}});let data={};try{data=await response.json()}catch{}if(!response.ok||data.sucesso===false)throw new Error(data.erro||"Erro na API");return data}
    async function uploadImage(file,pasta="servicos"){if(!file)return null;if(file.size>8*1024*1024)throw new Error("A imagem deve ter no máximo 8 MB.");const allowed=["image/jpeg","image/png","image/webp"];if(!allowed.includes(file.type))throw new Error("Use uma imagem JPG, PNG ou WEBP.");const form=new FormData();form.append("file",file);form.append("pasta",pasta);const response=await fetch(API+"/api/upload",{method:"POST",headers:{Authorization:TOKEN?"Bearer "+TOKEN:""},body:form});let data={};try{data=await response.json()}catch{}if(!response.ok||data.sucesso===false)throw new Error(data.erro||"Não foi possível enviar a imagem.");return data}
    function modal(html){$("#modal").innerHTML='<div class="modal-box">'+html+"</div>";$("#modal").classList.remove("hidden")}
    function closeModal(){$("#modal").classList.add("hidden");$("#modal").innerHTML=""}
    const titles={dashboard:"Dashboard",site:"Página inicial",servicos:"Serviços",promocoes:"Promoções",agendamentos:"Agendamentos",clientes:"Clientes"};
    async function show(section){document.querySelectorAll("main section").forEach(node=>node.classList.add("hidden"));$("#sec-"+section).classList.remove("hidden");$("#section-title").textContent=titles[section]||section;document.querySelectorAll("[data-section]").forEach(button=>button.classList.toggle("active",button.dataset.section===section));await loadSection(section)}
    async function loadSection(section){try{if(section==="dashboard")await dashboard();if(section==="site")await site();if(section==="servicos")await services();if(section==="promocoes")await promotions();if(section==="agendamentos")await bookings();if(section==="clientes")await clients()}catch(error){$("#sec-"+section).innerHTML='<div class="panel">Erro: '+esc(error.message)+"</div>"}}
    async function dashboard(){const d=await api("/api/dashboard");const data=d.dashboard||{};$("#sec-dashboard").innerHTML='<div class="cards"><div class="card">Serviços<strong>'+Number(data.servicos||0)+"</strong></div><div class=\"card\">Promoções<strong>"+Number(data.promocoes||0)+"</strong></div><div class=\"card\">Clientes<strong>"+Number(data.clientes||0)+"</strong></div><div class=\"card\">Agendamentos<strong>"+Number(data.agendamentos||0)+"</strong></div></div>"}
    const labels={nome_empresa:"Nome da empresa",whatsapp:"WhatsApp",instagram:"Instagram",instagram_url:"URL do Instagram",endereco:"Endereço",cnpj:"CNPJ",seo_titulo:"Título SEO",seo_descricao:"Descrição SEO",hero_eyebrow:"Hero — texto superior",hero_titulo:"Hero — título",hero_texto:"Hero — texto",horario_presencial:"Horário presencial",horario_antecipado:"Horário antecipado",motor_aviso:"Aviso da lavagem de motor"};
    async function site(){const d=await api("/api/configuracoes");CONFIG=d.configuracoes||{};const keys=Object.keys(CONFIG).sort();$("#sec-site").innerHTML='<div class="panel"><p class="muted">Altere os textos e parâmetros já cadastrados. As chaves técnicas são exibidas para não perder nenhuma configuração existente.</p><div class="grid">'+keys.map(key=>'<div class="field '+(String(CONFIG[key]).length>90?"full":"")+'"><label>'+esc(labels[key]||key)+' <span class="config-key">'+esc(key)+"</span></label>"+(String(CONFIG[key]).length>90?'<textarea data-config="'+esc(key)+'">'+esc(CONFIG[key])+"</textarea>":'<input data-config="'+esc(key)+'" value="'+esc(CONFIG[key])+'">')+"</div>").join("")+'</div><button class="btn primary" id="save-config">Salvar configurações</button></div>';$("#save-config").onclick=saveConfig}
    async function saveConfig(){const payload={};document.querySelectorAll("[data-config]").forEach(input=>payload[input.dataset.config]=input.value);await api("/api/configuracoes",{method:"PUT",body:JSON.stringify(payload)});alert("Configurações salvas.");await site()}
    async function services(){const d=await api("/api/servicos?admin=1");SERVICES=d.servicos||[];const categoryList=[...new Set(SERVICES.map(service=>String(service.categoria||"Outros").trim()||"Outros"))];$("#sec-servicos").innerHTML='<div class="panel"><div class="actions"><button class="btn primary" id="new-service">Novo serviço</button><span class="muted">Os detalhes salvos aqui aparecem no catálogo e na página “Saiba mais”.</span></div></div><div class="panel"><p class="muted">Categorias cadastradas: '+(categoryList.length?categoryList.map(esc).join(" · "):"nenhuma")+'</p><div class="table-wrap"><table class="table"><thead><tr><th>Serviço</th><th>Categoria</th><th>Preço</th><th>Duração</th><th>Ordem</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+SERVICES.map(service=>'<tr><td>'+(service.imagem?'<img class="image-thumb" src="'+esc(service.imagem)+'" alt="">':"")+'<strong>'+esc(service.nome)+'</strong><small>'+esc(service.descricao_curta||service.descricao||"Sem resumo")+'</small></td><td>'+esc(service.categoria||"Outros")+'</td><td>'+money(service.preco)+(service.preco_tipo==="a_partir_de"?' <span class="status">a partir</span>':"")+'</td><td>'+Number(service.duracao_minutos||0)+' min</td><td>'+Number(service.ordem||0)+'</td><td>'+(Number(service.ativo)===1?"Ativo":"Inativo")+'</td><td><button class="btn secondary" data-edit-service="'+Number(service.id)+'">Editar</button> <button class="btn danger" data-disable-service="'+Number(service.id)+'">Desativar</button></td></tr>').join("")+'</tbody></table></div></div>';$("#new-service").onclick=()=>openService();document.querySelectorAll("[data-edit-service]").forEach(button=>button.onclick=()=>openService(Number(button.dataset.editService)));document.querySelectorAll("[data-disable-service]").forEach(button=>button.onclick=()=>deleteService(Number(button.dataset.disableService)))}
    function openService(id){const service=SERVICES.find(item=>Number(item.id)===Number(id))||{};const categories=[...new Set(SERVICES.map(item=>item.categoria).filter(Boolean))];const short=service.descricao_curta||service.descricao||"";const complete=service.descricao_completa||service.descricao||"";modal(`<h2>${id?"Editar":"Novo"} serviço</h2><p class="muted">Use uma linha por item incluso. O catálogo usa a descrição curta; a página individual usa a completa.</p><div class="grid"><div class="field"><label>Nome *</label><input id="sf-name" value="${esc(service.nome||"")}"></div><div class="field"><label>Categoria *</label><input id="sf-category" list="categories" value="${esc(service.categoria||"Lavagem")}"><datalist id="categories">${categories.map(category=>`<option value="${esc(category)}">`).join("")}</datalist></div><div class="field full"><label>Imagem do serviço</label><input id="sf-image-file" type="file" accept="image/jpeg,image/png,image/webp"><small class="muted">JPG, PNG ou WEBP • máximo 8 MB.</small><div id="sf-image-preview" style="margin-top:8px">${service.imagem?`<img src="${esc(service.imagem)}" alt="" style="display:block;max-width:220px;max-height:140px;border-radius:10px;object-fit:cover;border:1px solid #2b323a">`:''}</div><input id="sf-image" type="hidden" value="${esc(service.imagem||"")}"></div><div class="field full"><label>Descrição curta</label><textarea id="sf-short">${esc(short)}</textarea></div><div class="field full"><label>Descrição completa</label><textarea id="sf-complete">${esc(complete)}</textarea></div><div class="field full"><label>O que está incluído</label><textarea id="sf-items" placeholder="Um item por linha">${esc(service.itens_inclusos||"")}</textarea></div><div class="field full"><label>Observações, indicações ou restrições</label><textarea id="sf-notes">${esc(service.observacoes||"")}</textarea></div><div class="field"><label>Preço *</label><input id="sf-price" type="number" min="0" step="0.01" value="${Number(service.preco||0)}"></div><div class="field"><label>Tipo de preço</label><select id="sf-price-type"><option value="fixo" ${service.preco_tipo!=="a_partir_de"?"selected":""}>Preço fixo</option><option value="a_partir_de" ${service.preco_tipo==="a_partir_de"?"selected":""}>A partir de</option></select></div><div class="field"><label>Duração (minutos)</label><input id="sf-duration" type="number" min="0" step="1" value="${Number(service.duracao_minutos||0)}"></div><div class="field"><label>Ordem de exibição</label><input id="sf-order" type="number" step="1" value="${Number(service.ordem||0)}"></div><div class="field"><label><input id="sf-active" type="checkbox" ${Number(service.ativo||0)===1||!id?"checked":""}> Serviço ativo no site</label></div></div><div class="actions"><button class="btn primary" id="save-service">Salvar serviço</button><button class="btn secondary" id="cancel-service">Cancelar</button></div>`);$("#sf-image-file").onchange=()=>{const file=$("#sf-image-file").files[0];if(!file)return;const preview=$("#sf-image-preview");const url=URL.createObjectURL(file);preview.innerHTML='<img src="'+url+'" alt="" style="display:block;max-width:220px;max-height:140px;border-radius:10px;object-fit:cover;border:1px solid #2b323a">'};$("#save-service").onclick=()=>saveService(id);$("#cancel-service").onclick=closeModal}
    async function saveService(id){const nome=$("#sf-name").value.trim(),categoria=$("#sf-category").value.trim();if(!nome||!categoria){alert("Preencha o nome e a categoria.");return}try{const file=$("#sf-image-file")?.files?.[0];let imagem=$("#sf-image").value.trim();if(file){const upload=await uploadImage(file,"servicos");imagem=upload.url||""}const short=$("#sf-short").value.trim();const body={nome,categoria,imagem,descricao:short,descricao_curta:short,descricao_completa:$("#sf-complete").value.trim(),itens_inclusos:$("#sf-items").value.trim(),observacoes:$("#sf-notes").value.trim(),preco:Number($("#sf-price").value||0),preco_tipo:$("#sf-price-type").value,duracao_minutos:Number($("#sf-duration").value||0),ordem:Number($("#sf-order").value||0),ativo:$("#sf-active").checked?1:0};await api(id?"/api/servicos/"+id:"/api/servicos",{method:id?"PUT":"POST",body:JSON.stringify(body)});closeModal();await services()}catch(error){alert(error.message||"Não foi possível salvar o serviço.")}}
    async function deleteService(id){if(!confirm("Desativar este serviço? Ele deixará de aparecer para os clientes."))return;await api("/api/servicos/"+id,{method:"DELETE"});await services()}
    async function promotions(){const d=await api("/api/promocoes?admin=1");PROMOTIONS=d.promocoes||[];$("#sec-promocoes").innerHTML='<div class="panel"><button class="btn primary" id="new-promotion">Nova promoção</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Título</th><th>Preço</th><th>Período</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+PROMOTIONS.map(promo=>'<tr><td>'+esc(promo.titulo)+'</td><td>'+money(promo.preco)+'</td><td>'+esc(promo.data_inicio||"-")+" → "+esc(promo.data_fim||"-")+'</td><td>'+(Number(promo.ativo)===1?"Ativa":"Inativa")+'</td><td><button class="btn secondary" data-edit-promo="'+Number(promo.id)+'">Editar</button> <button class="btn danger" data-delete-promo="'+Number(promo.id)+'">Desativar</button></td></tr>').join("")+'</tbody></table></div>';$("#new-promotion").onclick=()=>openPromotion();document.querySelectorAll("[data-edit-promo]").forEach(button=>button.onclick=()=>openPromotion(Number(button.dataset.editPromo)));document.querySelectorAll("[data-delete-promo]").forEach(button=>button.onclick=()=>deletePromotion(Number(button.dataset.deletePromo)))}
    function openPromotion(id){const promo=PROMOTIONS.find(item=>Number(item.id)===Number(id))||{};modal(`<h2>${id?"Editar":"Nova"} promoção</h2><div class="grid"><div class="field"><label>Título *</label><input id="pf-title" value="${esc(promo.titulo||"")}"></div><div class="field full"><label>Imagem da promoção</label><input id="pf-image-file" type="file" accept="image/jpeg,image/png,image/webp"><small class="muted">JPG, PNG ou WEBP • máximo 8 MB. A imagem será enviada automaticamente para o R2 ao salvar.</small><div id="pf-image-preview" style="margin-top:8px">${promo.imagem?`<img src="${esc(promo.imagem)}" alt="" style="display:block;max-width:320px;max-height:180px;border-radius:10px;object-fit:cover;border:1px solid #2b323a">`:''}</div><input id="pf-image" type="hidden" value="${esc(promo.imagem||"")}"></div><div class="field"><label>Preço promocional</label><input id="pf-price" type="number" min="0" step="0.01" value="${Number(promo.preco||0)}"></div><div class="field"><label>Preço anterior</label><input id="pf-previous" type="number" min="0" step="0.01" value="${Number(promo.preco_anterior||0)}"></div><div class="field"><label>Início</label><input id="pf-start" type="date" value="${esc(promo.data_inicio||"")}"></div><div class="field"><label>Fim</label><input id="pf-end" type="date" value="${esc(promo.data_fim||"")}"></div><div class="field full"><label>Descrição</label><textarea id="pf-description">${esc(promo.descricao||"")}</textarea></div><div class="field"><label><input id="pf-active" type="checkbox" ${Number(promo.ativo||0)===1||!id?"checked":""}> Promoção ativa</label></div></div><div class="actions"><button class="btn primary" id="save-promotion">Salvar</button><button class="btn secondary" id="cancel-promotion">Cancelar</button></div>`);$("#pf-image-file").onchange=()=>{const file=$("#pf-image-file").files[0];if(!file)return;const preview=$("#pf-image-preview");const url=URL.createObjectURL(file);preview.innerHTML='<img src="'+url+'" alt="" style="display:block;max-width:320px;max-height:180px;border-radius:10px;object-fit:cover;border:1px solid #2b323a">'};$("#save-promotion").onclick=()=>savePromotion(id);$("#cancel-promotion").onclick=closeModal}
    async function savePromotion(id){const titulo=$("#pf-title").value.trim();if(!titulo){alert("Preencha o título da promoção.");return}try{const file=$("#pf-image-file")?.files?.[0];let imagem=$("#pf-image").value.trim();if(file){const upload=await uploadImage(file,"promocoes");imagem=upload.url||""}const body={titulo,imagem,descricao:$("#pf-description").value.trim(),preco:Number($("#pf-price").value||0),preco_anterior:Number($("#pf-previous").value)||null,data_inicio:$("#pf-start").value||null,data_fim:$("#pf-end").value||null,ativo:$("#pf-active").checked?1:0};await api(id?"/api/promocoes/"+id:"/api/promocoes",{method:id?"PUT":"POST",body:JSON.stringify(body)});closeModal();await promotions()}catch(error){alert(error.message||"Não foi possível salvar a promoção.")}}
    async function deletePromotion(id){if(!confirm("Desativar esta promoção?"))return;await api("/api/promocoes/"+id,{method:"DELETE"});await promotions()}
    async function bookings(){const d=await api("/api/agendamentos");const rows=d.agendamentos||[];const body=rows.map(row=>`<tr><td><strong>${esc(row.cliente||"-")}</strong><small>${esc(row.telefone||"")}</small></td><td>${esc(row.data||"-")}<small>${esc(row.hora_inicio||"")} — ${esc(row.hora_fim||"")}</small></td><td>${esc(row.servicos_nomes||"-")}</td><td>${money(row.total)}</td><td><span class="status">${esc(row.status||"pendente")}</span></td><td><button class="btn secondary" data-edit-booking="${Number(row.id)}">Editar</button></td></tr>`).join("");$("#sec-agendamentos").innerHTML='<div class="panel table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Data e horário</th><th>Serviços</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>';document.querySelectorAll("[data-edit-booking]").forEach(button=>button.onclick=()=>openBooking(Number(button.dataset.editBooking),rows))}
    function openBooking(id,rows){const booking=rows.find(item=>Number(item.id)===Number(id));if(!booking)return;modal(`<h2>Agendamento #${booking.id}</h2><p><strong>${esc(booking.cliente||"-")}</strong> — ${esc(booking.data)} às ${esc(booking.hora_inicio||"")}</p><p class="muted">Ligação se antecipar: ${Number(booking.receber_ligacao_antecipacao)===1?"Sim":"Não"} · Ciência motor: ${Number(booking.ciencia_lavagem_motor)===1?"Sim":"Não"} · Pagamento: ${Number(booking.pagamento_confirmado)===1?"Confirmado":"Pendente"}</p><div class="field"><label>Status</label><select id="bf-status"><option value="pendente">Pendente</option><option value="agendado">Agendado</option><option value="confirmado">Confirmado</option><option value="em_andamento">Em andamento</option><option value="concluido">Concluído</option><option value="cancelado">Cancelado</option></select></div><div class="field"><label>Observações</label><textarea id="bf-notes">${esc(booking.observacoes||"")}</textarea></div><div class="actions"><button class="btn primary" id="save-booking">Salvar</button><button class="btn secondary" id="cancel-booking">Cancelar</button></div>`);$("#bf-status").value=booking.status||"pendente";$("#save-booking").onclick=()=>saveBooking(id);$("#cancel-booking").onclick=closeModal}
    async function saveBooking(id){await api("/api/agendamentos/"+id,{method:"PUT",body:JSON.stringify({status:$("#bf-status").value,observacoes:$("#bf-notes").value})});closeModal();await bookings()}
    async function clients(){const d=await api("/api/clientes");const rows=d.clientes||[];$("#sec-clientes").innerHTML='<div class="panel table-wrap"><table class="table"><thead><tr><th>Nome</th><th>WhatsApp</th><th>E-mail</th><th>Cadastro</th></tr></thead><tbody>'+rows.map(row=>'<tr><td>'+esc(row.nome)+'</td><td>'+esc(row.telefone||"-")+'</td><td>'+esc(row.email||"-")+'</td><td>'+esc(row.criado_em||"-")+'</td></tr>').join("")+'</tbody></table></div>'}
    async function login(event){event.preventDefault();try{const d=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("#login-email").value,password:$("#login-password").value})});TOKEN=d.token;localStorage.setItem("imperium_admin_token",TOKEN);openApp()}catch(error){$("#login-error").textContent=error.message;$("#login-error").style.color="#ff8f8f"}}
    function logout(){TOKEN="";localStorage.removeItem("imperium_admin_token");location.reload()}
    function openApp(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");show("dashboard")}
    $("#login-form").onsubmit=login;$("#logout").onclick=logout;$("#refresh").onclick=()=>{const section=$("main section:not(.hidden)").id.replace("sec-","");loadSection(section)};document.querySelectorAll("[data-section]").forEach(button=>button.onclick=()=>show(button.dataset.section));if(TOKEN)openApp();
  </script>
</body>
</html>
