<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin | IMPÉRIUM</title><style>body{margin:0;font-family:Arial,sans-serif;background:#0b0d10;color:#fff}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.login-box{width:min(420px,calc(100% - 32px));background:#171a1f;border:1px solid #30353d;border-radius:18px;padding:28px;box-sizing:border-box}.login-box h1{margin:0 0 6px}.login-box p{color:#9da5af}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:13px;color:#b8c0ca}.field input,.field textarea,.field select{padding:11px;border:1px solid #3b424c;border-radius:9px;background:#0f1114;color:#fff}.field textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#0fb8ad;color:#061311}.secondary{background:#29313b;color:#fff}.danger{background:#6b2020;color:#fff}.layout{display:flex;min-height:100vh}.sidebar{width:235px;background:#11151a;border-right:1px solid #2a3037;padding:20px;box-sizing:border-box;position:fixed;inset:0 auto 0 0}.sidebar h2{margin-top:0}.nav button{width:100%;text-align:left;margin:4px 0;background:transparent;color:#cfd5dc;border:0;padding:11px;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.active{background:#1e2832;color:#fff}.main{margin-left:235px;padding:28px;width:calc(100% - 235px);box-sizing:border-box}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.panel{background:#14191f;border:1px solid #2b323a;border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #2b323a;text-align:left;vertical-align:top}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#14191f;border:1px solid #2b323a;border-radius:14px;padding:16px}.card strong{display:block;font-size:25px;margin-top:5px}.muted{color:#9da5af}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.cms-group{border:1px solid #2b323a;border-radius:14px;padding:16px;margin-bottom:15px}.cms-group h3{margin-top:0}.status{padding:4px 8px;border-radius:99px;background:#29313b;display:inline-block}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:10}.modal-box{width:min(700px,100%);max-height:90vh;overflow:auto;background:#151a20;border:1px solid #333;border-radius:16px;padding:20px}.review-admin-list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.review-admin-card{background:#11161b;border:1px solid #2b323a;border-radius:14px;overflow:hidden}.review-admin-card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#0b0d10}.review-admin-body{padding:14px}.review-admin-body h3{margin:0 0 6px}.review-admin-meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;color:#b8c0ca;font-size:13px}.review-admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:1050px){.review-admin-list{grid-template-columns:repeat(2,1fr)}}@media(max-width:850px){.sidebar{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}.cards{grid-template-columns:1fr 1fr}}@media(max-width:650px){.sidebar{position:static;width:100%;min-height:auto}.layout{display:block}.main{margin-left:0;width:100%;padding:18px}.grid,.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><section id="login" class="login"><div class="login-box"><h1>IMPÉRIUM</h1><p>Painel Administrativo</p><form id="login-form"><div class="field"><label>E-mail</label><input id="login-email" type="email" value="admin@imperium.local"></div><div class="field"><label>Senha</label><input id="login-password" type="password" required></div><button class="btn primary" style="width:100%">Entrar</button><p id="login-error"></p></form></div></section><div id="app" class="layout hidden"><aside class="sidebar"><h2>IMPÉRIUM</h2><p class="muted">Administração</p><nav class="nav"><button data-section="dashboard">Dashboard</button><button data-section="site">Página inicial</button><button data-section="servicos">Serviços</button><button data-section="promocoes">Promoções</button><button data-section="avaliacoes">Avaliações do Google</button><button data-section="agendamentos">Agendamentos</button><button data-section="clientes">Clientes</button><button id="logout">Sair</button></nav></aside><main class="main"><div class="top"><div><h1 id="section-title">Dashboard</h1><p class="muted">Controle central do site e da operação.</p></div><button class="btn secondary" onclick="carregarTudo()">Atualizar</button></div><section id="sec-dashboard"></section><section id="sec-site" class="hidden"></section><section id="sec-servicos" class="hidden"></section><section id="sec-promocoes" class="hidden"></section><section id="sec-avaliacoes" class="hidden"></section><section id="sec-agendamentos" class="hidden"></section><section id="sec-clientes" class="hidden"></section></main></div><div id="modal" class="modal hidden"></div><script>const API='https://imperium-api.imperiumlj.workers.dev';let TOKEN=localStorage.getItem('imperium_admin_token')||'';let CONFIG={};let SERVICES=[];let REVIEWS=[];function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0)}async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',Authorization:TOKEN?'Bearer '+TOKEN:''}});let d={};try{d=await r.json()}catch{}if(!r.ok||d.sucesso===false)throw new Error(d.erro||'Erro na API');return d}function show(sec){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById('sec-'+sec).classList.remove('hidden');document.getElementById('section-title').textContent={dashboard:'Dashboard',site:'Página inicial',servicos:'Serviços',promocoes:'Promoções',avaliacoes:'Avaliações do Google',agendamentos:'Agendamentos',clientes:'Clientes'}[sec]||sec;carregarSecao(sec)}async function login(e){e.preventDefault();try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({email:document.getElementById('login-email').value,password:document.getElementById('login-password').value})});TOKEN=d.token;localStorage.setItem('imperium_admin_token',TOKEN);openApp()}catch(e){document.getElementById('login-error').textContent=e.message;document.getElementById('login-error').style.color='#ff8f8f'}}async function openApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');show('dashboard')}function logout(){TOKEN='';localStorage.removeItem('imperium_admin_token');location.reload()}async function carregarSecao(s){try{if(s==='dashboard')await dashboard();if(s==='site')await site();if(s==='servicos')await servicos();if(s==='promocoes')await promocoes();if(s==='avaliacoes')await avaliacoes();if(s==='agendamentos')await agendamentos();if(s==='clientes')await clientes()}catch(e){document.getElementById('sec-'+s).innerHTML='<div class="panel">Erro: '+esc(e.message)+'</div>'}}async function carregarTudo(){const s=document.querySelector('main section:not(.hidden)')?.id?.replace('sec-','')||'dashboard';await carregarSecao(s)}async function dashboard(){const d=await api('/api/dashboard');document.getElementById('sec-dashboard').innerHTML='<div class="cards"><div class="card">Serviços<strong>'+d.dashboard.servicos+'</strong></div><div class="card">Promoções<strong>'+d.dashboard.promocoes+'</strong></div><div class="card">Clientes<strong>'+d.dashboard.clientes+'</strong></div><div class="card">Agendamentos<strong>'+d.dashboard.agendamentos+'</strong></div></div>'}const cms=[

async function site(){const d=await api('/api/configuracoes');CONFIG=d.configuracoes||{};let html='';for(const group of [...new Set(cms.map(x=>x[0]))]){html+='<div class="panel"><h2>'+group+'</h2><div class="grid">';for(const [g,k,label,type] of cms.filter(x=>x[0]===group)){html+='<div class="field '+(type==='textarea'?'full':'')+'"><label>'+esc(label)+'</label>'+(type==='textarea'?'<textarea data-cms="'+k+'">'+esc(CONFIG[k]||'')+'</textarea>':'<input data-cms="'+k+'" value="'+esc(CONFIG[k]||'')+'">')+'</div>'}html+='</div></div>'}html+='<div class="panel"><button class="btn primary" onclick="saveSite()">Salvar todas as alterações</button></div>';document.getElementById('sec-site').innerHTML=html}async function saveSite(){const obj={};document.querySelectorAll('[data-cms]').forEach(x=>obj[x.dataset.cms]=x.value);await api('/api/configuracoes',{method:'PUT',body:JSON.stringify(obj)});alert('Configurações salvas.');await site()}async function servicos(){const d=await api('/api/servicos?admin=1');SERVICES=d.servicos||[];document.getElementById('sec-servicos').innerHTML='<div class="panel"><div class="actions"><button class="btn primary" onclick="openService()">Novo serviço</button></div></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Nome</th><th>Categoria</th><th>Preço</th><th>Duração</th><th>Ativo</th><th>Ações</th></tr></thead><tbody>'+SERVICES.map(s=>'<tr><td>'+esc(s.nome)+'</td><td>'+esc(s.categoria||'-')+'</td><td>'+money(s.preco)+(s.preco_tipo==='a_partir_de'?' <span class="status">a partir</span>':'')+'</td><td>'+esc(s.duracao_minutos||0)+' min</td><td>'+(Number(s.ativo)===1?'Sim':'Não')+'</td><td><button class="btn secondary" onclick="openService('+s.id+')">Editar</button> <button class="btn danger" onclick="deleteService('+s.id+')">Excluir</button></td></tr>').join('')+'</tbody></table></div>'}function openService(id){const s=SERVICES.find(x=>Number(x.id)===Number(id))||{};modal(`<h2>${id?'Editar':'Novo'} serviço</h2><div class="grid"><div class="field"><label>Nome</label><input id="sf-nome" value="${esc(s.nome||'')}"></div><div class="field"><label>Categoria</label><input id="sf-cat" value="${esc(s.categoria||'Lavagem')}"></div><div class="field full"><label>Descrição</label><textarea id="sf-desc">${esc(s.descricao||'')}</textarea></div><div class="field"><label>Preço</label><input id="sf-preco" type="number" step="0.01" value="${Number(s.preco||0)}"></div><div class="field"><label>Tipo de preço</label><select id="sf-tipo"><option value="fixo" ${s.preco_tipo!=='a_partir_de'?'selected':''}>Preço fixo</option><option value="a_partir_de" ${s.preco_tipo==='a_partir_de'?'selected':''}>A partir de</option></select></div><div class="field"><label>Duração (minutos)</label><input id="sf-dur" type="number" value="${Number(s.duracao_minutos||0)}"></div><div class="field"><label>Ordem</label><input id="sf-ord" type="number" value="${Number(s.ordem||0)}"></div><div class="field"><label><input id="sf-ativo" type="checkbox" ${Number(s.ativo||0)===1||!id?'checked':''}> Serviço ativo no site</label></div></div><div class="actions"><button class="btn primary" onclick="saveService(${id||0})">Salvar</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div>`)}async function saveService(id){const body={nome:document.getElementById('sf-nome').value.trim(),categoria:document.getElementById('sf-cat').value.trim(),descricao:document.getElementById('sf-desc').value,preco:Number(document.getElementById('sf-preco').value),preco_tipo:document.getElementById('sf-tipo').value,duracao_minutos:Number(document.getElementById('sf-dur').value),ordem:Number(document.getElementById('sf-ord').value||0),ativo:document.getElementById('sf-ativo').checked?1:0};await api(id?'/api/servicos/'+id:'/api/servicos',{method:id?'PUT':'POST',body:JSON.stringify(body)});closeModal();await servicos()}async function deleteService(id){if(!confirm('Excluir este serviço?'))return;await api('/api/servicos/'+id,{method:'DELETE'});await servicos()}async function promocoes(){const d=await api('/api/promocoes?admin=1');const p=d.promocoes||[];document.getElementById('sec-promocoes').innerHTML='<div class="panel"><button class="btn primary" onclick="openPromo()">Nova promoção</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Título</th><th>Preço</th><th>Período</th><th>Ativa</th><th>Ações</th></tr></thead><tbody>'+p.map(x=>'<tr><td>'+esc(x.titulo)+'</td><td>'+money(x.preco)+'</td><td>'+esc(x.data_inicio||'-')+' → '+esc(x.data_fim||'-')+'</td><td>'+(Number(x.ativo)===1?'Sim':'Não')+'</td><td><button class="btn secondary" onclick="openPromo('+x.id+')">Editar</button> <button class="btn danger" onclick="deletePromo('+x.id+')">Excluir</button></td></tr>').join('')+'</tbody></table></div>'}async function openPromo(id){const d=await api('/api/promocoes?admin=1');const p=(d.promocoes||[]).find(x=>Number(x.id)===Number(id))||{};modal(`<h2>${id?'Editar':'Nova'} promoção</h2><div class="grid"><div class="field"><label>Título</label><input id="pf-titulo" value="${esc(p.titulo||'')}"></div><div class="field"><label>Preço promocional</label><input id="pf-preco" type="number" step="0.01" value="${Number(p.preco||0)}"></div><div class="field"><label>Preço anterior</label><input id="pf-anterior" type="number" step="0.01" value="${Number(p.preco_anterior||0)}"></div><div class="field"><label>Data início</label><input id="pf-inicio" type="date" value="${esc(p.data_inicio||'')}"></div><div class="field"><label>Data fim</label><input id="pf-fim" type="date" value="${esc(p.data_fim||'')}"></div><div class="field full"><label>Descrição</label><textarea id="pf-desc">${esc(p.descricao||'')}</textarea></div><div class="field"><label><input id="pf-ativo" type="checkbox" ${Number(p.ativo||0)===1||!id?'checked':''}> Promoção ativa</label></div></div><div class="actions"><button class="btn primary" onclick="savePromo(${id||0})">Salvar</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div>`)}async function savePromo(id){const body={titulo:document.getElementById('pf-titulo').value.trim(),descricao:document.getElementById('pf-desc').value,preco:Number(document.getElementById('pf-preco').value),preco_anterior:Number(document.getElementById('pf-anterior').value)||null,data_inicio:document.getElementById('pf-inicio').value||null,data_fim:document.getElementById('pf-fim').value||null,ativo:document.getElementById('pf-ativo').checked?1:0};await api(id?'/api/promocoes/'+id:'/api/promocoes',{method:id?'PUT':'POST',body:JSON.stringify(body)});closeModal();await promocoes()}async function deletePromo(id){if(!confirm('Excluir esta promoção?'))return;await api('/api/promocoes/'+id,{method:'DELETE'});await promocoes()}async function uploadImage(file,pasta='avaliacoes'){if(!file)return null;if(file.size>8*1024*1024)throw new Error('Imagem muito grande. Limite de 8 MB.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Formato inválido. Use JPG, PNG ou WEBP.');const form=new FormData();form.append('file',file);form.append('pasta',pasta);const r=await fetch(API+'/api/upload',{method:'POST',headers:{Authorization:TOKEN?'Bearer '+TOKEN:''},body:form});let d={};try{d=await r.json()}catch{}if(!r.ok||d.sucesso===false)throw new Error(d.erro||'Erro ao enviar imagem');return d.url}async function avaliacoes(){const d=await api('/api/avaliacoes?admin=1');REVIEWS=d.avaliacoes||[];const el=document.getElementById('sec-avaliacoes');el.innerHTML='<div class="panel"><div class="actions"><button class="btn primary" onclick="openReview()">Nova avaliação</button></div><p class="muted">Cadastre o print da avaliação e o link direto para ela no Google. A imagem é armazenada no R2.</p></div><div class="review-admin-list">'+(REVIEWS.length?REVIEWS.map(r=>{const n=Number(r.nota||0);return '<article class="review-admin-card"><img src="'+esc(r.imagem)+'" alt="Avaliação '+esc(r.nome||'Google')+'"><div class="review-admin-body"><h3>'+esc(r.nome||'Avaliação sem nome')+'</h3><div class="review-admin-meta"><span>'+((n?'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n)): 'Nota não informada'))+'</span><span>Ordem: '+Number(r.ordem||0)+'</span><span>'+(Number(r.ativo)===1?'Ativa':'Inativa')+'</span></div><a href="'+esc(r.link_google)+'" target="_blank" rel="noopener noreferrer" class="muted">Abrir no Google →</a><div class="review-admin-actions"><button class="btn secondary" onclick="openReview('+r.id+')">Editar</button><button class="btn danger" onclick="deleteReview('+r.id+')">Desativar</button></div></div></article>'}).join(''):'<div class="panel"><p class="muted">Nenhuma avaliação cadastrada.</p></div>')+'</div>'}function openReview(id){const r=REVIEWS.find(x=>Number(x.id)===Number(id))||{};modal('<h2>'+ (id?'Editar':'Nova') +' avaliação do Google</h2><div class="grid"><div class="field"><label>Nome do cliente (opcional)</label><input id="rf-nome" value="'+esc(r.nome||'')+'"></div><div class="field"><label>Nota (opcional)</label><select id="rf-nota"><option value="">Não informar</option>'+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+(Number(r.nota)===n?'selected':'')+'>'+n+' estrela'+(n>1?'s':'')+'</option>').join('')+'</select></div><div class="field"><label>Ordem</label><input id="rf-ordem" type="number" min="0" value="'+Number(r.ordem||0)+'"></div><div class="field"><label><input id="rf-ativo" type="checkbox" '+(Number(r.ativo)===1||!id?'checked':'')+'> Avaliação ativa no site</label></div><div class="field full"><label>Link direto da avaliação no Google *</label><input id="rf-link" type="url" placeholder="https://maps.app.goo.gl/..." value="'+esc(r.link_google||'')+'"></div><div class="field full"><label>Print da avaliação *</label><input id="rf-file" type="file" accept="image/jpeg,image/png,image/webp"><input id="rf-imagem" type="hidden" value="'+esc(r.imagem||'')+'"><div id="rf-preview-wrap" style="margin-top:10px;">'+(r.imagem?'<img id="rf-preview" src="'+esc(r.imagem)+'" alt="Prévia" style="display:block;max-width:100%;max-height:280px;border-radius:10px;border:1px solid #333;object-fit:contain">':'<img id="rf-preview" alt="Prévia" style="display:none;max-width:100%;max-height:280px;border-radius:10px;border:1px solid #333;object-fit:contain">')+'</div></div></div><div class="actions"><button class="btn primary" onclick="saveReview('+ (id||0) +')">Salvar</button><button class="btn secondary" onclick="closeModal()">Cancelar</button></div>');document.getElementById('rf-file').onchange=e=>{const f=e.target.files[0],img=document.getElementById('rf-preview');if(!f){return}img.src=URL.createObjectURL(f);img.style.display='block'}}async function saveReview(id){try{const link=document.getElementById('rf-link').value.trim();if(!/^https?:\/\//i.test(link))throw new Error('Informe um link válido do Google começando com http:// ou https://.');let imagem=document.getElementById('rf-imagem').value.trim();const file=document.getElementById('rf-file').files[0];if(file)imagem=await uploadImage(file,'avaliacoes');if(!imagem)throw new Error('Envie o print da avaliação.');const body={nome:document.getElementById('rf-nome').value.trim()||null,imagem,nota:document.getElementById('rf-nota').value?Number(document.getElementById('rf-nota').value):null,link_google:link,ordem:Number(document.getElementById('rf-ordem').value||0),ativo:document.getElementById('rf-ativo').checked?1:0};await api(id?'/api/avaliacoes/'+id:'/api/avaliacoes',{method:id?'PUT':'POST',body:JSON.stringify(body)});closeModal();await avaliacoes()}catch(e){alert(e.message)}}async function deleteReview(id){if(!confirm('Desativar esta avaliação do site?'))return;await api('/api/avaliacoes/'+id,{method:'DELETE'});await avaliacoes()}async function agendamentos(){const d=await api('/api/agendamentos');const a=d.agendamentos||[];document.getElementById('sec-agendamentos').innerHTML='<div class="panel table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Data</th><th>Horário</th><th>Serviços</th><th>Duração</th><th>Total</th><th>Status</th><th>Antecipação</th><th></th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.cliente||'-')+'</td><td>'+esc(x.data||'-')+'</td><td>'+esc(x.hora_inicio||'-')+' - '+esc(x.hora_fim||'-')+'</td><td>'+esc(x.servicos_nomes||'-')+'</td><td>'+esc(x.duracao_minutos||0)+' min</td><td>'+money(x.total)+'</td><td><span class="status">'+esc(x.status||'pendente')+'</span></td><td>'+ (Number(x.receber_ligacao_antecipacao)===1?'Sim':'Não') +'</td><td><button class="btn secondary" onclick="editBooking('+x.id+')">Editar</button></td></tr>').join('')+'</tbody></table></div>'}async function editBooking(id){const d=await api('/api/agendamentos');const x=(d.agendamentos||[]).find(y=>Number(y.id)===Number(id));if(!x)return;modal(`<h2>Agendamento #${x.id}</h2><p><b>${esc(x.cliente||'-')}</b> — ${esc(x.data)} ${esc(x.hora_inicio||'')}</p><p class="muted">Ligação se antecipar: <b>${Number(x.receber_ligacao_antecipacao)===1?'Sim':'Não'}</b> · Ciência motor: <b>${Number(x.ciencia_lavagem_motor)===1?'Sim':'Não'}</b> · Pagamento confirmado: <b>${Number(x.pagamento_confirmado)===1?'Sim':'Não'}</b></p><div class="field"><label>Status</label><select id="bf-status"><option value="agendado">Agendado</option><option value="confirmado">Confirmado</option><option value="em_andamento">Em andamento</option><option value="concluido">Concluído</option><option value="cancelado">Cancelado</option></select></div><div class="field"><label>Observações</label><textarea id="bf-obs">${esc(x.observacoes||'')}</textarea></div><button class="btn primary" onclick="saveBooking(${id})">Salvar</button>`);document.getElementById('bf-status').value=x.status||'agendado'}async function saveBooking(id){await api('/api/agendamentos/'+id,{method:'PUT',body:JSON.stringify({status:document.getElementById('bf-status').value,observacoes:document.getElementById('bf-obs').value})});closeModal();await agendamentos()}async function clientes(){const d=await api('/api/clientes');const c=d.clientes||[];doc
